<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noda</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="app.css" />
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
</head>
<body>
  <header class="titlebar">
    <div class="tb-left">
      <button class="tb-btn" id="navtoggle" title="Скрыть/показать панель">
        <svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="tb-controls">
      <button class="tb-dot min" id="min" title="Свернуть" aria-label="Свернуть"></button>
      <button class="tb-dot max" id="max" title="Развернуть" aria-label="Развернуть"></button>
      <button class="tb-dot close" id="close" title="Закрыть" aria-label="Закрыть"></button>
    </div>
  </header>

  <div class="shell">
    <aside id="nav" class="sidebar hidden"></aside>
    <main id="app"></main>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
