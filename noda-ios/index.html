<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ECECF1">
  <title>Noda</title>
  <link rel="icon" href="assets/noda.png">
  <link rel="stylesheet" href="styles.css?v=ios-13">
</head>
<body>
  <section class="gate" id="gate">
    <form class="gate-card glass" id="gateForm">
      <span class="gate-mark"><img src="assets/noda.png" alt=""></span>
      <h1>Noda</h1>
      <p>Финансы, заметки и компьютер — в одном месте</p>
      <input class="gate-field" id="gatePassword" type="password" inputmode="numeric" autocomplete="current-password" maxlength="16" placeholder="••••" autofocus>
      <p class="gate-error" id="gateError"></p>
      <button class="btn primary big" type="submit">Войти</button>
    </form>
  </section>

  <div class="shell" id="app" hidden>
    <aside class="sidebar glass">
      <div class="brand">
        <img src="assets/noda.png" alt="">
        <div><strong>Noda</strong><small>рабочий контур</small></div>
      </div>
      <nav class="nav" id="nav" aria-label="Разделы"></nav>
      <div class="sidebar-foot">
        <div id="deviceList"></div>
      </div>
    </aside>

    <main class="work glass">
      <header class="toolbar" id="toolbar"></header>
      <section class="screen" id="screen" aria-live="polite"></section>
      <div class="dock" id="dock"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="viewer" id="viewer">
    <button type="button" id="viewerClose" aria-label="Закрыть">✕</button>
    <img id="viewerImage" src="" alt="" draggable="false">
    <div class="zoom-hint">Колесо — приблизить, двойной клик — 2×, перетаскивание — сдвинуть</div>
  </div>

  <script type="module" src="app.js?v=ios-13"></script>
</body>
</html>
