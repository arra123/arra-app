<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arra · Live Activity — макет</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
<style>
  :root {
    --glass: rgba(28, 28, 32, 0.62);
    --line: rgba(255, 255, 255, 0.08);
    --text: #f5f5f7;
    --sub: rgba(235, 235, 245, 0.62);
    --faint: rgba(235, 235, 245, 0.38);
    --work: #64d2ff;
    --wait: #ffd60a;
    --done: #30d158;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--text); font-family: Inter, -apple-system, system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .ms { font-family: 'Material Symbols Rounded'; font-variation-settings: 'FILL' 1, 'wght' 600; line-height: 1; }

  /* ---------------------------------------------------------- wallpaper */
  .screen { position: absolute; inset: 0; overflow: hidden; }
  .wall { position: absolute; inset: -20%; background: radial-gradient(60% 40% at 20% 25%, #3b2a7a 0%, transparent 70%),
          radial-gradient(55% 45% at 85% 60%, #0f4c6b 0%, transparent 70%),
          radial-gradient(70% 50% at 40% 100%, #4a1d4f 0%, transparent 70%), #07070b;
          animation: drift 18s ease-in-out infinite alternate; filter: saturate(1.15); }
  @keyframes drift { to { transform: translate(-4%, 3%) scale(1.06); } }

  /* ---------------------------------------------------------- lock screen */
  .lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 58px; transition: opacity .5s, transform .6s cubic-bezier(.2,.9,.2,1); }
  .date { font-size: 19px; font-weight: 600; color: rgba(255,255,255,.82); letter-spacing: .2px; }
  .clock { font-size: 96px; font-weight: 700; letter-spacing: -3px; line-height: 1; margin-top: 2px; color: rgba(255,255,255,.9);
           background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,.55)); -webkit-background-clip: text; color: transparent; }

  /* the Live Activity card */
  .la { position: absolute; left: 12px; right: 12px; bottom: 96px; border-radius: 26px; padding: 16px 16px 14px;
        background: var(--glass); backdrop-filter: blur(34px) saturate(1.6); -webkit-backdrop-filter: blur(34px) saturate(1.6);
        border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.35);
        animation: rise .8s cubic-bezier(.2,.9,.2,1) both .2s; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.96); } }
  .la-head { display: flex; align-items: center; gap: 10px; }
  .la-title { font-size: 16px; font-weight: 700; }
  .la-sub { font-size: 13px; color: var(--sub); margin-top: 1px; }
  .la-head .right { margin-left: auto; text-align: right; }
  .la-head .big { font-size: 26px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .la-head .cap { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .6px; }

  .rows { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 16px; background: rgba(255,255,255,.05); }
  .tile { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; color: #fff; flex: none; }
  .row .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 12px; color: var(--sub); }
  .row .mid { flex: 1; min-width: 0; }
  .pill { font-size: 11.5px; font-weight: 700; padding: 5px 9px; border-radius: 999px; display: flex; align-items: center; gap: 5px; flex: none; }
  .pill.work { color: var(--work); background: rgba(100,210,255,.14); }
  .pill.wait { color: var(--wait); background: rgba(255,214,10,.16); animation: pulse 1.6s ease-in-out infinite; }
  .pill.done { color: var(--done); background: rgba(48,209,88,.15); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(255,214,10,.08); } }
  .dots i { display: inline-block; width: 4px; height: 4px; border-radius: 2px; background: currentColor; margin-left: 2px; animation: dot 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s } .dots i:nth-child(3) { animation-delay: .3s }
  @keyframes dot { 0%, 60%, 100% { opacity: .25; transform: translateY(0) } 30% { opacity: 1; transform: translateY(-2px) } }

  /* the time line: each agent a coloured stripe, working ones shimmer */
  .timeline { margin-top: 12px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); display: flex; gap: 3px; overflow: hidden; }
  .seg { height: 100%; border-radius: 3px; position: relative; overflow: hidden; }
  .seg.live::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shine 1.8s linear infinite; }
  @keyframes shine { from { transform: translateX(-100%) } to { transform: translateX(100%) } }
  .foot { display: flex; justify-content: space-between; margin-top: 7px; font-size: 11px; color: var(--faint); }

  .lock-bottom { position: absolute; bottom: 26px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 44px; }
  .round { width: 50px; height: 50px; border-radius: 25px; background: rgba(255,255,255,.12); backdrop-filter: blur(20px); display: grid; place-items: center; font-size: 22px; }

  /* ---------------------------------------------------------- Arra mascot */
  .mascot { width: 34px; height: 23px; border-radius: 11px; background: #f4f4f7; position: relative; flex: none; box-shadow: 0 0 14px rgba(255,255,255,.28); }
  .mascot::before, .mascot::after { content: ''; position: absolute; top: 6px; width: 4px; height: 9px; border-radius: 2px; background: #16171b; animation: blink 4s infinite; }
  .mascot::before { left: 10px } .mascot::after { right: 10px }
  .mascot.small { width: 24px; height: 16px; border-radius: 8px; }
  .mascot.small::before, .mascot.small::after { top: 4px; width: 3px; height: 7px; }
  .mascot.small::before { left: 7px } .mascot.small::after { right: 7px }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  .mascot.work { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px) } }

  /* ---------------------------------------------------------- Dynamic Island */
  .island { position: absolute; top: 6px; z-index: 5; left: 50%; transform: translateX(-50%); background: #000; border-radius: 22px; overflow: hidden;
            transition: width .55s cubic-bezier(.2,1.2,.3,1), height .55s cubic-bezier(.2,1.2,.3,1), border-radius .5s, top .4s; }
  .island.compact { width: 210px; height: 37px; top: 6px; border-radius: 19px; }
  .island.expanded { width: 412px; height: 178px; top: 4px; border-radius: 44px; }
  .isl-compact { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; transition: opacity .25s; }
  .ring { width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(var(--work) calc(var(--p) * 1%), rgba(255,255,255,.12) 0); display: grid; place-items: center; }
  .ring::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: #000; }
  .isl-compact .n { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 7px; }
  .isl-exp { position: absolute; inset: 0; padding: 50px 22px 16px; opacity: 0; transition: opacity .3s .15s; }
  .island.expanded .isl-exp { opacity: 1; } .island.expanded .isl-compact { opacity: 0; }
  .isl-exp .top { display: flex; align-items: center; gap: 10px; }
  .chips { display: flex; gap: 6px; margin-top: 14px; }
  .chip { flex: 1; border-radius: 14px; padding: 8px 10px; background: rgba(255,255,255,.07); }
  .chip .k { font-size: 11px; color: var(--sub); } .chip .v { font-size: 17px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------- scenes */
  .caption { position: absolute; left: 0; right: 0; bottom: 84px; text-align: center; font-size: 12.5px; color: var(--sub); pointer-events: none; transition: opacity .3s; }
  .nav { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 7px; z-index: 9; }
  .nav b { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.3); transition: width .3s, background .3s; cursor: pointer; }
  .nav b.on { width: 22px; background: #fff; }
  .toast { position: absolute; top: 52px; z-index: 4; left: 10px; right: 10px; border-radius: 24px; padding: 12px 14px; display: flex; gap: 11px; align-items: center;
           background: rgba(40,40,44,.72); backdrop-filter: blur(30px); border: 1px solid var(--line); transform: translateY(-140%); transition: transform .6s cubic-bezier(.2,1.1,.3,1); }
  .toast.on { transform: none; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="wall"></div>

  <!-- Dynamic Island: in the preview it sits just under the phone's own island -->
  <div class="island compact" id="island" onclick="toggleIsland()">
    <div class="isl-compact">
      <div class="mascot small work"></div>
      <div class="n"><span id="cN">3</span><div class="ring" id="cRing" style="--p:62"></div></div>
    </div>
    <div class="isl-exp">
      <div class="top">
        <div class="mascot work"></div>
        <div><div class="la-title">3 агента работают</div><div class="la-sub">на ПК · самый долгий 42 мин</div></div>
      </div>
      <div class="chips">
        <div class="chip"><div class="k">работают</div><div class="v" style="color:var(--work)">2</div></div>
        <div class="chip"><div class="k">ждут тебя</div><div class="v" style="color:var(--wait)">1</div></div>
        <div class="chip"><div class="k">готово</div><div class="v" style="color:var(--done)">4</div></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <div class="mascot"></div>
    <div style="flex:1;min-width:0"><div class="la-title" style="font-size:14px">Доработка системы · готово</div><div class="la-sub">helper · 42 мин · «Всё собрано, проверь телефон»</div></div>
    <span class="ms" style="color:var(--done);font-size:22px">check_circle</span>
  </div>

  <div class="lock" id="lock">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>

    <div class="la" id="la">
      <div class="la-head">
        <div class="mascot work"></div>
        <div>
          <div class="la-title">Arra</div>
          <div class="la-sub" id="laSub">3 агента работают · ПК</div>
        </div>
        <div class="right"><div class="big" id="elapsed">42:18</div><div class="cap">в работе</div></div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="timeline" id="tl"></div>
      <div class="foot"><span>началось в 23:39</span><span id="eta">обновлено сейчас</span></div>
    </div>

    <div class="lock-bottom"><div class="round ms">flashlight_on</div><div class="round ms">photo_camera</div></div>
  </div>

  <div class="caption" id="cap"></div>
  <div class="nav" id="nav"></div>
</div>

<script>
const agents = [
  { t: 'Доработка системы', p: 'helper', c: '#5e5ce6', g: 'tune', s: 'work', min: 42 },
  { t: 'Альфолипоевая кислота', p: '14_visual-system', c: '#bf5af2', g: 'grid_view', s: 'work', min: 18 },
  { t: 'СДМ-Банк: карта', p: 'helper', c: '#ff9f0a', g: 'credit_card', s: 'wait', min: 7 },
  { t: 'Input lag на ПК', p: 'helper', c: '#30d158', g: 'sports_esports', s: 'done', min: 25 },
];
const pill = s => s === 'work' ? '<div class="pill work">работает<span class="dots"><i></i><i></i><i></i></span></div>'
  : s === 'wait' ? '<div class="pill wait"><span class="ms" style="font-size:13px">front_hand</span>ждёт тебя</div>'
  : '<div class="pill done"><span class="ms" style="font-size:13px">check</span>готово</div>';
document.getElementById('rows').innerHTML = agents.map(a => `
  <div class="row">
    <div class="tile ms" style="background:${a.c}">${a.g}</div>
    <div class="mid"><div class="t">${a.t}</div><div class="s">${a.p} · ${a.min} мин</div></div>
    ${pill(a.s)}
  </div>`).join('');
const total = agents.reduce((n, a) => n + a.min, 0);
document.getElementById('tl').innerHTML = agents.map(a =>
  `<div class="seg ${a.s === 'work' ? 'live' : ''}" style="flex:${a.min};background:${a.s === 'done' ? 'var(--done)' : a.s === 'wait' ? 'var(--wait)' : a.c}"></div>`).join('');

// clock and the running time
const pad = n => String(n).padStart(2, '0');
let secs = 42 * 60 + 18;
function tick() {
  const d = new Date();
  document.getElementById('clock').textContent = d.getHours() + ':' + pad(d.getMinutes());
  document.getElementById('date').textContent = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  secs++;
  document.getElementById('elapsed').textContent = Math.floor(secs / 60) + ':' + pad(secs % 60);
  const ring = document.getElementById('cRing');
  ring.style.setProperty('--p', 30 + (secs % 70));
}
tick(); setInterval(tick, 1000);

// scenes: the lock screen card, the island expanded, a finished agent
const scenes = [
  { cap: 'Экран блокировки: живая карточка агентов', go() { island.className = 'island compact'; toast.classList.remove('on'); lock.style.opacity = 1; } },
  { cap: 'Dynamic Island: долгое нажатие раскрывает сводку', go() { island.className = 'island expanded'; toast.classList.remove('on'); lock.style.opacity = .35; } },
  { cap: 'Агент закончил: баннер и галочка в карточке', go() { island.className = 'island compact'; lock.style.opacity = 1; setTimeout(() => toast.classList.add('on'), 250); } },
];
const island = document.getElementById('island'), toast = document.getElementById('toast'), lock = document.getElementById('lock');
let cur = 0, timer;
function show(i) {
  cur = (i + scenes.length) % scenes.length;
  scenes[cur].go();
  document.getElementById('cap').textContent = scenes[cur].cap;
  document.getElementById('nav').innerHTML = scenes.map((_, k) => `<b class="${k === cur ? 'on' : ''}" onclick="show(${k});restart()"></b>`).join('');
}
function restart() { clearInterval(timer); timer = setInterval(() => show(cur + 1), 6000); }
function toggleIsland() { show(cur === 1 ? 0 : 1); restart(); }
document.getElementById('screen').addEventListener('click', e => { if (e.target.closest('.nav') || e.target.closest('#island')) return; show(cur + 1); restart(); });
show(0); restart();
</script>
</body>
</html>
